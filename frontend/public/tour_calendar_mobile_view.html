<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmed Tours Calendar - Style A Mobile View</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
    
    @keyframes blink-red {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 8px rgba(225, 29, 72, 0.9); }
      50% { opacity: 0.25; transform: scale(0.85); box-shadow: 0 0 2px rgba(225, 29, 72, 0.2); }
    }
    .animate-blink-red {
      animation: blink-red 1.2s infinite ease-in-out;
    }

    .iphone-frame {
      width: 100%;
      max-width: 410px;
      height: 840px;
      border-radius: 48px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.3), 0 0 0 12px #18181b;
      overflow: hidden;
      position: relative;
    }
  </style>
</head>
<body class="bg-[#e2dfd8] text-[#1c1917] min-h-screen p-4 flex flex-col items-center justify-center">

  <div class="max-w-md w-full mb-3 flex items-center justify-between">
    <div>
      <span class="text-[10px] font-bold uppercase tracking-widest text-[#78716c] bg-[#edeae4] px-2.5 py-0.5 rounded-full border border-[#d6d3d0]">
        Style A Mobile Production View
      </span>
      <h1 class="font-serif text-lg font-bold text-[#1c1917]">Confirmed Tours Mobile Calendar</h1>
    </div>
  </div>

  <!-- Mobile Phone Mockup Device Shell -->
  <div class="iphone-frame bg-[#f7f5f0] border border-[#d6d3d0] flex flex-col justify-between">
    
    <!-- Top Status Bar & App Header -->
    <div class="bg-white border-b border-[#e7e4df] pt-3 px-5 pb-3 shrink-0">
      <div class="w-28 h-4 bg-[#18181b] rounded-full mx-auto mb-3"></div>

      <div class="flex items-center justify-between">
        <button class="p-1.5 rounded-xl text-[#78716c] hover:bg-[#f7f5f0]">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <div class="text-center">
          <span class="text-[9px] font-bold uppercase tracking-wider text-[#78716c]">Operations Roster</span>
          <h2 class="font-serif text-base font-bold text-[#1c1917]">Confirmed Tours</h2>
        </div>
        <button class="p-1.5 rounded-xl text-[#78716c] hover:bg-[#f7f5f0]">
          <i data-lucide="filter" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Month Stepper Bar -->
      <div class="flex items-center justify-between mt-3 bg-[#fbfaf8] p-2 rounded-xl border border-[#e7e4df]">
        <button class="text-xs font-bold text-[#78716c] px-2 py-0.5">‹ Jul</button>
        <span class="font-serif text-sm font-bold text-[#1c1917]">August 2026</span>
        <button class="text-xs font-bold text-[#78716c] px-2 py-0.5">Sep ›</button>
      </div>
    </div>

    <!-- Scrollable Mobile Calendar Content Area -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4">
      
      <!-- Legend Pill -->
      <div class="flex items-center justify-between text-[10px] font-bold text-[#78716c] bg-white px-3 py-2 rounded-xl border border-[#e7e4df]">
        <div class="flex items-center gap-1.5">
          <span class="h-4 w-4 rounded-full bg-[#1c1917] text-white font-bold text-[8px] flex items-center justify-center">18</span>
          <span>Highlighted Tour Badge</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-rose-600 animate-blink-red"></span>
          <span class="text-rose-700">Clash Alert</span>
        </div>
      </div>

      <!-- Days of Week Header -->
      <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-[#a8a29e] uppercase">
        <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
      </div>

      <!-- Calendar Mobile Cells Grid -->
      <div id="calendar-grid-mobile" class="grid grid-cols-7 gap-1.5">
        <!-- JS populated cells -->
      </div>

      <!-- Mobile Selected Day Drawer Card -->
      <div class="bg-white rounded-2xl p-4 border border-[#e7e4df] shadow-sm space-y-3">
        <div class="flex items-center justify-between border-b border-[#e7e4df] pb-2">
          <div>
            <span class="text-[9px] font-bold text-[#a8a29e] uppercase">Selected Date</span>
            <h3 id="mobile-selected-date" class="font-serif text-base font-bold text-[#1c1917]">August 18, 2026</h3>
          </div>
          <span id="mobile-tour-count-badge" class="px-2.5 py-0.5 rounded-full text-[9px] font-bold bg-[#fef3c7] text-[#b45309] border border-[#fde68a]">
            2 Tours Booked
          </span>
        </div>

        <div id="mobile-tour-list" class="space-y-2">
          <!-- Dynamic Mobile Items -->
        </div>
      </div>

    </div>

    <!-- Mobile Navigation Bottom Bar -->
    <div class="bg-white border-t border-[#e7e4df] px-6 py-3 flex items-center justify-around text-center text-[10px] font-bold text-[#78716c] shrink-0">
      <div class="text-[#1c1917] flex flex-col items-center">
        <i data-lucide="calendar" class="w-5 h-5 text-[#1c1917]"></i>
        <span class="mt-0.5">Calendar</span>
      </div>
      <div class="flex flex-col items-center">
        <i data-lucide="map-pin" class="w-5 h-5 text-[#a8a29e]"></i>
        <span class="mt-0.5">Tours</span>
      </div>
      <div class="flex flex-col items-center">
        <i data-lucide="users" class="w-5 h-5 text-[#a8a29e]"></i>
        <span class="mt-0.5">Guides</span>
      </div>
      <div class="flex flex-col items-center">
        <i data-lucide="settings" class="w-5 h-5 text-[#a8a29e]"></i>
        <span class="mt-0.5">Settings</span>
      </div>
    </div>

  </div>

  <script>
    const tourData = {
      4: { count: 1, clash: false, tours: [{ title: 'Pyramids Classic Tour', time: '08:30 AM', guide: 'Mahmoud H.', status: 'Confirmed' }] },
      7: { count: 2, clash: false, tours: [{ title: 'Grand Museum Walk', time: '10:00 AM', guide: 'Sarah K.', status: 'Confirmed' }, { title: 'Nile Sunset Felucca', time: '05:30 PM', guide: 'Capt. Bob', status: 'Confirmed' }] },
      12: { count: 1, clash: false, tours: [{ title: 'Islamic Citadel Walk', time: '09:00 AM', guide: 'Tarek A.', status: 'Confirmed' }] },
      15: { count: 3, clash: true, tours: [{ title: 'Saqqara Day Tour', time: '09:00 AM', guide: 'Ahmed Y.', status: 'Confirmed' }, { title: 'Bazaar Guided Walk', time: '10:00 AM', guide: 'Ahmed Y.', status: 'CLASH ⚠️ Double Booked' }, { title: 'Sound & Light Show', time: '07:30 PM', guide: 'Samir N.', status: 'Confirmed' }] },
      18: { count: 2, clash: false, tours: [{ title: 'Coptic Cairo Churches', time: '09:30 AM', guide: 'Marina F.', status: 'Confirmed' }, { title: 'Old Cairo Food Walk', time: '02:00 PM', guide: 'Chef Omar', status: 'Confirmed' }] },
      22: { count: 1, clash: false, tours: [{ title: 'Alexandria Day Excursion', time: '07:00 AM', guide: 'Khaled M.', status: 'Confirmed' }] },
      25: { count: 2, clash: true, tours: [{ title: 'Quad Bike Safari', time: '03:00 PM', guide: 'Hassan R.', status: 'CLASH ⚠️ Overlap' }, { title: 'Bedouin Dinner Night', time: '04:30 PM', guide: 'Hassan R.', status: 'CLASH ⚠️ Overlap' }] },
      28: { count: 1, clash: false, tours: [{ title: 'Luxor Fly-In Tour', time: '05:00 AM', guide: 'Mostafa H.', status: 'Confirmed' }] },
    };

    let selectedDay = 18;

    function renderMobileCalendar() {
      const grid = document.getElementById('calendar-grid-mobile');
      grid.innerHTML = '';

      for (let i = 0; i < 6; i++) {
        const blank = document.createElement('div');
        blank.className = 'h-14 rounded-xl bg-[#f7f5f0] border border-[#e7e4df]/40 opacity-30';
        grid.appendChild(blank);
      }

      for (let day = 1; day <= 31; day++) {
        const hasTour = !!tourData[day];
        const data = tourData[day] || { count: 0, clash: false };
        const isSelected = day === selectedDay;

        const cell = document.createElement('div');
        cell.onclick = () => selectDay(day);

        let cellClasses = `h-14 rounded-xl p-1 flex flex-col justify-between items-center cursor-pointer transition-all relative overflow-hidden `;

        if (isSelected) {
          cellClasses += `ring-2 ring-[#1c1917] `;
        }

        if (hasTour) {
          cellClasses += `bg-[#fef3c7]/80 border border-[#fde68a] `;
        } else {
          cellClasses += `bg-white border border-[#e7e4df] `;
        }

        let dotsHTML = '';
        if (hasTour) {
          dotsHTML += '<div class="flex items-center gap-0.5 mt-0.5 flex-wrap justify-center">';
          for (let d = 0; d < data.count; d++) {
            dotsHTML += '<span class="w-1.5 h-1.5 rounded-full bg-[#1c1917]"></span>';
          }
          dotsHTML += '</div>';
        }

        let clashBadge = '';
        if (data.clash) {
          clashBadge = `<span class="w-2.5 h-2.5 rounded-full bg-rose-600 animate-blink-red absolute top-1 right-1"></span>`;
        }

        let dayNumHTML = '';
        if (hasTour) {
          dayNumHTML = `<span class="h-5 w-5 rounded-full bg-[#1c1917] text-white font-bold text-[10px] flex items-center justify-center mt-0.5">${day}</span>`;
        } else {
          dayNumHTML = `<span class="font-bold text-xs text-[#44403c] mt-0.5">${day}</span>`;
        }

        cell.className = cellClasses;
        cell.innerHTML = `
          ${clashBadge}
          ${dayNumHTML}
          ${dotsHTML}
        `;

        grid.appendChild(cell);
      }

      renderMobileDetails();
      lucide.createIcons();
    }

    function selectDay(day) {
      selectedDay = day;
      renderMobileCalendar();
    }

    function renderMobileDetails() {
      const title = document.getElementById('mobile-selected-date');
      const badge = document.getElementById('mobile-tour-count-badge');
      const list = document.getElementById('mobile-tour-list');

      title.innerText = `August ${selectedDay}, 2026`;
      const data = tourData[selectedDay];

      if (!data) {
        badge.innerText = 'No Tours';
        badge.className = 'px-2 py-0.5 rounded-full text-[9px] font-bold bg-[#f5f5f4] text-[#78716c] border border-[#e7e4df]';
        list.innerHTML = `
          <div class="p-3 text-center rounded-xl bg-[#fbfaf8] border border-[#e7e4df]">
            <p class="text-xs font-bold text-[#78716c]">No tours scheduled for this date.</p>
          </div>
        `;
        return;
      }

      badge.innerText = `${data.count} Tour${data.count > 1 ? 's' : ''}`;
      badge.className = data.clash
        ? 'px-2.5 py-0.5 rounded-full text-[9px] font-bold bg-rose-100 text-rose-800 border border-rose-300 animate-pulse'
        : 'px-2.5 py-0.5 rounded-full text-[9px] font-bold bg-[#fef3c7] text-[#b45309] border border-[#fde68a]';

      list.innerHTML = data.tours.map(t => `
        <div class="p-2.5 rounded-xl ${t.status.includes('CLASH') ? 'bg-rose-50 border border-rose-200' : 'bg-[#fbfaf8] border border-[#e7e4df]'} space-y-1">
          <div class="flex items-center justify-between">
            <h4 class="text-xs font-bold text-[#1c1917] truncate">${t.title}</h4>
            <span class="text-[8px] font-bold px-1.5 py-0.5 rounded ${t.status.includes('CLASH') ? 'text-rose-700 bg-rose-100' : 'text-emerald-700 bg-emerald-100'}">${t.status}</span>
          </div>
          <div class="flex items-center justify-between text-[10px] text-[#78716c]">
            <span>🕒 ${t.time}</span>
            <span>👤 ${t.guide}</span>
          </div>
        </div>
      `).join('');
    }

    renderMobileCalendar();
  </script>
</body>
</html>
